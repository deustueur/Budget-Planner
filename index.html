async function executeOverwrite(){
  if(!accessToken){alert('Connect to Google first.');return;}
  const sheetId=document.getElementById('ow-sheet-id').value.trim();
  const sheetName=document.getElementById('ow-sheet-name').value.trim()||DEFAULT_SHEET_NAME;
  if(!sheetId){alert('Enter a spreadsheet ID.');return;}
  activeConn.sheetId=sheetId;activeConn.sheetName=sheetName;
  document.getElementById('overwrite-overlay').classList.remove('open');
  setSyncStatus('syncing','Rebuilding sheet...');
  try{
    const meta=await apiCall('GET',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties`);
    const existingSheets=meta.sheets?.map(s=>({title:s.properties.title,id:s.properties.sheetId}))||[];
    const tabsNeeded=[sheetName,'Tracker','Savings','Instruments','Events','_Config'];
    const requests=[];
    // Delete all sheets except first (can't delete all)
    existingSheets.forEach((s,i)=>{if(i>0)requests.push({deleteSheet:{sheetId:s.id}});});
    // Add required tabs
    tabsNeeded.slice(1).forEach(title=>requests.push({addSheet:{properties:{title}}}));
    if(requests.length)await apiCall('POST',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`,{requests});
    // Rename first sheet to dashboard name
    const firstId=existingSheets[0]?.id||0;
    await apiCall('POST',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`,{requests:[{updateSheetProperties:{properties:{sheetId:firstId,title:sheetName},fields:'title'}}]});
    // Push data to each tab
    await sheetsPush();
    const now=new Date();
    await saveMonthTabToSheet(now.getMonth(),now.getFullYear(),sheetId,[
      [`Budget — ${MONTHS[now.getMonth()]} ${now.getFullYear()}`,'Budget (LKR)','Actual (LKR)','Variance','Owner','Purpose'],
      ['INCOME'],...items.filter(i=>i.type==='income').map(i=>[i.name,Math.round(toMonthly(i.val,i.freq)),'','',i.owner,'']),
      [''],['EXPENSES'],...items.filter(i=>i.type==='expense').map(i=>[i.name,Math.round(toMonthly(i.val,i.freq)),'','',i.owner,i.purpose||'']),
    ],true);
    // Config tab
    const configData=[['key','value'],['dashboard_tab',sheetName],['data_version','2'],['last_overwrite',new Date().toISOString()],['drive_folder',DRIVE_FOLDER_ID]];
    await apiCall('PUT',sheetUrl(sheetId,'_Config','A1')+'?valueInputOption=USER_ENTERED',{values:configData});
    setSyncStatus('connected','Sheet rebuilt');setLastSync();
    alert('Sheet successfully rebuilt. Both the site and sheet now share the same structure.');
  } catch(e){setSyncStatus('error','Overwrite failed: '+e.message.slice(0,50));console.error(e);}
}

function deleteConn(id){connections=connections.filter(c=>c.id!==id);renderConnList();markDirty();}
function connectWith(connId){
  const conn=connections.find(c=>c.id===connId);if(!conn)return;
  activeConn=conn;setSyncStatus('syncing','Connecting...');
  waitForGis(()=>{
    try{
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:conn.clientId,scope:SCOPES,
        callback:(resp)=>{
          if(resp.error){setSyncStatus('error','Auth failed: '+resp.error);return;}
          accessToken=resp.access_token;conn.active=true;
          closeConnModal();
          setSyncStatus('connected','Connected — '+conn.sheetName);
          const bp=document.getElementById('btn-pull');if(bp)bp.style.display='';
          const bpu=document.getElementById('btn-push');if(bpu)bpu.style.display='';
          const bow=document.getElementById('btn-overwrite');if(bow)bow.style.display='';
          const bc=document.getElementById('btn-cal');if(bc)bc.style.display='';
          document.getElementById('btn-connect').textContent='Connections';
          startPolling();sheetsPull();checkAutoMonthSave();markDirty();
        }
      });
      tokenClient.requestAccessToken({prompt:'consent'});
    } catch(e){setSyncStatus('error','Error: '+e.message);console.error(e);}
  });
}
function waitForGis(cb){
  if(typeof google!=='undefined'&&google.accounts){cb();return;}
  let n=0;const t=setInterval(()=>{
    if(typeof google!=='undefined'&&google.accounts){clearInterval(t);cb();}
    else if(++n>40){clearInterval(t);setSyncStatus('error','Google library load failed');}
  },250);
}

// AUTO MONTH SAVE
function checkAutoMonthSave(){
  const now=new Date();
  const currentKey=getTkey(now.getMonth(),now.getFullYear());
  let lastKey;
  try{lastKey=localStorage.getItem('bp_last_saved_month');}catch(e){}
  if(lastKey&&lastKey!==currentKey){
    const[y,m]=lastKey.split('-');
    saveMonthToAll(+m,+y,false);
  }
  carryForwardEvents();
}

// CALENDAR
function openCalModal(){
  const preview=document.getElementById('cal-preview');
  if(preview){
    const calItems=items.filter(i=>i.on&&i.dueDay>0);
    preview.innerHTML=calItems.length===0?'<div style="color:var(--text3);">No items have due days set.</div>':
      calItems.map(i=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border2);">
        <span>${i.name}</span><span>Day ${i.dueDay}${i.bufferDays?`, ${i.bufferDays}d reminder`:''}</span>
      </div>`).join('');
  }
  document.getElementById('cal-overlay').classList.add('open');
}
async function executeCalSync(){
  if(!accessToken){alert('Connect to Google first.');return;}
  document.getElementById('cal-overlay').classList.remove('open');
  const calItems=items.filter(i=>i.on&&i.dueDay>0);
  let synced=0,failed=0;
  for(const item of calItems){
    try{
      const now=new Date();
      const eventDate=new Date(now.getFullYear(),now.getMonth(),item.dueDay);
      if(eventDate<=now)eventDate.setMonth(eventDate.getMonth()+1);
      const dateStr=eventDate.toISOString().slice(0,10);
      const summary=item.type==='income'?`💰 Expected: ${item.name}`:`💳 Due: ${item.name}`;
      const eventBody={
        summary,
        description:`${fmtC(item.val)} ${item.freq} — ${item.type} — ${item.owner}\nManaged by Budget Planner`,
        start:{date:dateStr},end:{date:dateStr},
        recurrence:['RRULE:FREQ=MONTHLY'],
        colorId:item.type==='income'?'2':'11',
        reminders:{useDefault:false,overrides:item.bufferDays?[{method:'popup',minutes:item.bufferDays*24*60}]:[]}
      };
      // Update or create
      if(item.calEventId){
        try{
          await apiCall('PUT',`https://www.googleapis.com/calendar/v3/calendars/primary/events/${item.calEventId}`,eventBody);
        } catch(e){
          // If update fails (event deleted), create new
          const created=await apiCall('POST','https://www.googleapis.com/calendar/v3/calendars/primary/events',eventBody);
          item.calEventId=created.id;
        }
      } else {
        const created=await apiCall('POST','https://www.googleapis.com/calendar/v3/calendars/primary/events',eventBody);
        item.calEventId=created.id;
      }
      synced++;
    } catch(e){failed++;console.error('Cal event failed for',item.name,e);}
  }
  markDirty();
  addNotification('cal',`Calendar synced: ${synced} events.${failed?` ${failed} failed.`:''}`,null);
  alert(`Calendar sync complete.\n✅ ${synced} events synced.${failed?`\n⚠️ ${failed} failed.`:''}`);
}
async function scheduleCalendarEvent(itemName,amount,month,year,routeType,targetName){
  if(!accessToken)return;
  try{
    const date=new Date(year,month,1).toISOString().slice(0,10);
    await apiCall('POST','https://www.googleapis.com/calendar/v3/calendars/primary/events',{
      summary:`💚 Budget: ${itemName} surplus → ${targetName}`,
      description:`${fmtC(amount)} surplus from ${itemName} routed to ${targetName} (${routeType})`,
      start:{date},end:{date},colorId:'2'
    });
  } catch(e){console.error('Cal event:',e);}
}

// ════════════════════════════════════════════════════════════════
// STATE PERSISTENCE — localStorage + Drive
// ════════════════════════════════════════════════════════════════
function buildStatePayload(){
  return JSON.stringify({
    items,trackerData,savingsStreams,instruments,txEvents,monthHistory,monthNotes,
    accountBalance,connections:connections.map(c=>({...c,active:false})),
    templates,settlementHistory,currencySymbol,currencyLocale,isDarkTheme,
    _v:2,_ts:Date.now()
  });
}
function applyStatePayload(data){
  if(!data)return;
  if(data.items&&Array.isArray(data.items))items=data.items.map(i=>({...i,history:i.history||[],calEventId:i.calEventId||null}));
  if(data.trackerData)trackerData=data.trackerData;
  if(data.savingsStreams)savingsStreams=data.savingsStreams.map(s=>({...s,history:s.history||[]}));
  if(data.instruments)instruments=data.instruments;
  if(data.txEvents)txEvents=data.txEvents.map(e=>({...e,chain:e.chain||[]}));
  if(data.monthHistory)monthHistory=data.monthHistory;
  if(data.monthNotes)monthNotes=data.monthNotes;
  if(typeof data.accountBalance==='number')accountBalance=data.accountBalance;
  if(data.connections&&Array.isArray(data.connections)){
    connections=data.connections;
    // Always ensure default connection has the hardcoded credentials
    const def=connections.find(c=>c.id==='default');
    if(def){def.clientId=DEFAULT_CLIENT_ID;def.sheetId=SPREADSHEET_ID;def.sheetName=DEFAULT_SHEET_NAME;}
    activeConn=connections[0];
  }
  if(data.templates)templates=data.templates;
  if(data.settlementHistory)settlementHistory=data.settlementHistory;
  if(data.currencySymbol)currencySymbol=data.currencySymbol;
  if(data.currencyLocale)currencyLocale=data.currencyLocale;
  if(typeof data.isDarkTheme==='boolean')isDarkTheme=data.isDarkTheme;
}
let _saveDebounce2=null;
function markDirty(){
  // Immediately save to localStorage
  try{
    const payload=buildStatePayload();
    localStorage.setItem('bp_state',payload);
    localStorage.setItem('bp_state_ts',Date.now());
  } catch(e){console.warn('localStorage save failed:',e);}
  // Debounce Drive save
  if(accessToken){
    if(_saveDebounce2)clearTimeout(_saveDebounce2);
    _saveDebounce2=setTimeout(saveStateToDrive,3000);
  }
}
async function saveStateToDrive(){
  if(!accessToken)return;
  try{
    const payload=buildStatePayload();
    const searchRes=await apiCall('GET',`https://www.googleapis.com/drive/v3/files?q=name='${STATE_FILENAME}'+and+'${STATE_FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id)`);
    const existing=searchRes.files?.[0];
    const blob=new Blob([payload],{type:'application/json'});
    if(existing){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:blob});
    } else {
      const meta={name:STATE_FILENAME,parents:[STATE_FOLDER_ID]};
      const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob,STATE_FILENAME);
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+accessToken},body:form});
    }
  } catch(e){console.warn('Drive state save failed:',e);}
}
async function loadStateFromDrive(){
  if(!accessToken)return;
  try{
    const searchRes=await apiCall('GET',`https://www.googleapis.com/drive/v3/files?q=name='${STATE_FILENAME}'+and+'${STATE_FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,modifiedTime)`);
    const existing=searchRes.files?.[0];if(!existing)return;
    const localTs=+localStorage.getItem('bp_state_ts')||0;
    const driveTs=new Date(existing.modifiedTime).getTime();
    if(driveTs>localTs+5000){// Drive is newer — use it
      const res=await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`,{headers:{'Authorization':'Bearer '+accessToken}});
      const data=await res.json();
      applyStatePayload(data);recalc();updateEventsBadge();buildNotifications();renderTemplates();
    }
  } catch(e){console.warn('Drive state load:',e);}
}
function globalSave(){
  markDirty();
  if(accessToken)saveStateToDrive();
  downloadFile();
}
function saveFileAndSync(){
  if(accessToken)sheetsPush();
  downloadFile();
}
function downloadFile(){
  const html=document.documentElement.outerHTML;
  const stateScript=`<script>
(function(){
try{
const _state=${buildStatePayload()};
if(typeof applyStatePayload==='function'){applyStatePayload(_state);if(typeof recalc==='function')recalc();}
else{localStorage.setItem('bp_state',JSON.stringify(_state));localStorage.setItem('bp_state_ts',Date.now());}
}catch(e){console.warn('State restore failed',e);}
})();
<\/script>`;
  const finalHtml='<!DOCTYPE html>\n'+html.replace('</body>',stateScript+'</body>');
  const a=document.createElement('a');
  a.href='data:text/html;charset=utf-8,'+encodeURIComponent(finalHtml);
  a.download='index.html';a.click();
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
(function init(){
  applyTheme();
  initTracker();
  // Restore state from localStorage
  try{
    const localState=localStorage.getItem('bp_state');
    if(localState){
      const data=JSON.parse(localState);
      const ts=+localStorage.getItem('bp_state_ts')||0;
      if(ts>0&&data._v)applyStatePayload(data);
    }
  } catch(e){console.warn('State restore:',e);}
  recalc();
  updateEventsBadge();
  buildNotifications();
  ensureSavingStreams();
  renderTemplates();
  // Restore default connection credentials
  const def=connections.find(c=>c.id==='default');
  if(def){def.clientId=DEFAULT_CLIENT_ID;def.sheetId=SPREADSHEET_ID;def.sheetName=DEFAULT_SHEET_NAME;}
  // Currency badge click → settings
  const badge=document.getElementById('currency-badge');
  if(badge){
    badge.textContent=currencySymbol;
    badge.addEventListener('click',()=>{
      document.getElementById('currency-symbol').value=currencySymbol;
      document.getElementById('currency-locale').value=currencyLocale;
      document.getElementById('currency-overlay').classList.add('open');
    });
  }
})();
</script>
