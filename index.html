function uid(){return 'id_'+Math.random().toString(36).substr(2,9);}
function toMonthly(v,f){if(f==='daily')return v*30;if(f==='weekly')return v*52/12;if(f==='annual')return v/12;return v;}
function fmt(n){try{return Math.round(n).toLocaleString(currencyLocale);}catch(e){return Math.round(n).toLocaleString('en-LK');}}
function fmtC(n){return fmt(n)+' '+currencySymbol;}
function fmtS(n){return (n>=0?'+':'')+fmt(n);}
function getTkey(m,y){return `${y}-${m}`;}
function keyToLabel(key){const[y,m]=key.split('-');return MS[+m]+' '+y;}

function totalIncome(profile){
  return items.filter(i=>i.type==='income'&&i.on&&matchProfile(i,profile))
    .reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,profile),0);
}
function totalExpenses(profile){
  return items.filter(i=>i.type==='expense'&&i.on&&matchProfile(i,profile))
    .reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,profile),0);
}
function totalSavingsTagged(){
  return items.filter(i=>i.type==='expense'&&i.on&&i.purpose==='saving')
    .reduce((s,i)=>s+toMonthly(i.val,i.freq),0);
}
function matchProfile(item,profile){
  if(!profile||profile==='shared')return true;
  return item.owner===profile||item.owner==='shared';
}
function profileShare(item,profile){
  if(!profile||profile==='shared')return 1;
  if(item.owner===profile)return 1;
  if(item.owner==='shared'){const r=item.splitRatio||{trevin:50,dulini:50};return(r[profile]||50)/100;}
  return 0;
}
function getDaysUntil(dueDay){
  if(!dueDay)return null;
  const now=new Date();
  const target=new Date(now.getFullYear(),now.getMonth(),dueDay);
  if(target<=now)target.setMonth(target.getMonth()+1);
  return Math.ceil((target-now)/(1000*60*60*24));
}
function logItemHistory(item,oldVal,newVal,field){
  if(!item.history)item.history=[];
  item.history.unshift({field,oldVal,newVal,ts:Date.now(),date:new Date().toLocaleDateString('en-LK')});
  if(item.history.length>20)item.history=item.history.slice(0,20);
}
function getAllPurposeTags(){return['','saving','investment','loan','fd','fund'];}
function getAllCategories(){
  const base=['obligations','transport','lifestyle','wellbeing','subscriptions'];
  const custom=[...new Set(items.filter(i=>i.type==='expense'&&i.cat&&!base.includes(i.cat)).map(i=>i.cat))];
  return[...base,...custom];
}

// NOTIFICATIONS
// ════════════════════════════════════════════════════════════════
function buildNotifications(){
  notifications=[];
  const now=new Date();
  // Due soon
  items.filter(i=>i.on&&i.dueDay>0).forEach(item=>{
    const days=getDaysUntil(item.dueDay);
    const buf=item.bufferDays||3;
    if(days!==null&&days<=buf&&item.type==='expense'){
      notifications.push({type:'due',title:`${item.name} due in ${days===0?'TODAY':days+'d'}`,sub:fmtC(Math.round(toMonthly(item.val,item.freq))),itemId:item.id});
    }
  });
  // Untagged events
  const untagged=txEvents.filter(e=>e.status==='untagged'||e.status==='carried').length;
  if(untagged>0)notifications.push({type:'event',title:`${untagged} event${untagged>1?'s':''} need tagging`,sub:'Go to Events tab'});
  // Savings goals hit
  savingsStreams.forEach(s=>{
    if(s.goal>0&&s.balance>=s.goal)notifications.push({type:'goal',title:`${s.name} goal reached!`,sub:fmtC(s.balance)+' saved'});
  });
  // Loans close to clearing
  instruments.filter(i=>i.type==='loan'&&i.start&&i.period).forEach(instr=>{
    const start=new Date(instr.start+'-01');
    const passed=Math.max(0,(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth()));
    const remaining=instr.period-passed;
    if(remaining>0&&remaining<=3)notifications.push({type:'loan',title:`${instr.name} clears in ${remaining} month${remaining>1?'s':''}`,sub:'Consider redirecting payments'});
  });
  // Update bell
  const bell=document.getElementById('notif-bell');
  const countEl=bell?bell.querySelector('.notif-count'):null;
  if(countEl){countEl.textContent=notifications.length;countEl.style.display=notifications.length?'block':'none';}
  // Render list
  const list=document.getElementById('notif-list');
  if(list){
    list.innerHTML=notifications.length===0?'<div style="padding:14px;font-size:12px;color:var(--text3);text-align:center;">All clear!</div>':
      notifications.map(n=>`<div class="notif-item"><div class="notif-item-title">${n.title}</div><div class="notif-item-sub">${n.sub||''}</div></div>`).join('');
  }
}
function addNotification(type,title,sub){
  notifications.unshift({type,title,sub});
  buildNotifications();
}
function toggleNotifDropdown(){

document.addEventListener('click',e=>{
  const dd=document.getElementById('notif-dropdown');
  if(dd&&!dd.contains(e.target)&&!document.getElementById('notif-bell').contains(e.target))dd.style.display='none';
  hideContextMenu();
});

// ════════════════════════════════════════════════════════════════
// RECALC — single source of truth
// ════════════════════════════════════════════════════════════════
function recalc(){
  const inc=totalIncome(activeProfile);
  const exp=totalExpenses(activeProfile);
  const bal=inc-exp;
  const savTagged=totalSavingsTagged();
  const savRate=inc>0?(savTagged/inc)*100:0;
  const pct=inc>0?Math.min((exp/inc)*100,100):0;
  const untagged=txEvents.filter(e=>e.status==='untagged'||e.status==='carried').length;

  // Metrics
  const m=document.getElementById('dash-metrics');
  if(m)m.innerHTML=`
    <div class="metric-card"><div class="metric-label">Income</div><div class="metric-val">${fmtC(inc)}</div><div class="metric-sub">/ month</div></div>
    <div class="metric-card"><div class="metric-label">Expenses</div><div class="metric-val">${fmtC(exp)}</div><div class="metric-sub">/ month</div></div>
    <div class="metric-card"><div class="metric-label">Balance</div><div class="metric-val ${bal>=0?'green':'red'}">${fmtC(Math.abs(bal))}</div><div class="metric-sub">${bal>=0?'surplus':'deficit'}</div></div>
    <div class="metric-card"><div class="metric-label">Tagged savings</div><div class="metric-val green">${fmtC(savTagged)}</div><div class="metric-sub">${savRate.toFixed(1)}% of income</div></div>`;

  // Bar
  const fill=document.getElementById('bar-fill');
  if(fill){fill.style.width=pct+'%';fill.style.background=pct>95?'var(--danger)':pct>80?'var(--warning)':'var(--accent)';}
  const barLbl=document.getElementById('bar-pct-label');
  if(barLbl)barLbl.textContent=Math.round(pct)+'%';

  // Events banner
  const banner=document.getElementById('events-banner');
  const badge=document.getElementById('events-badge');
  if(banner){banner.style.display=untagged>0?'flex':'none';}
  if(badge){badge.textContent=untagged;badge.style.display=untagged>0?'inline':'none';}
  const bannerTxt=document.getElementById('events-banner-text');
  if(bannerTxt&&untagged>0)bannerTxt.textContent=`${untagged} event${untagged>1?'s':''} awaiting action`;

  renderIncomeRows();
  renderExpenseRows();
  renderDashSavings();
  updateCatChart();
  buildNotifications();
  markDirty();
}

  if(!savingItems.length&&!savingsStreams.length){panel.style.display='none';return;}

      itemsEl.innerHTML=savingItems.map(i=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border2);font-size:12px;">
          <span>${i.name}</span>
          <span style="font-weight:600;color:var(--accent);">${fmtC(Math.round(toMonthly(i.val,i.freq)))}/mo</span>

function renderIncomeRows(){
  const filtered=items.filter(i=>i.type==='income'&&(activeProfile==='shared'||matchProfile(i,activeProfile)));
  const total=filtered.filter(i=>i.on).reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,activeProfile),0);
  const lbl=document.getElementById('income-total-label');
  if(lbl)lbl.textContent=fmtC(total);
  const wrap=document.getElementById('income-rows');
  if(!wrap)return;
  wrap.innerHTML='';
  filtered.forEach(item=>{wrap.appendChild(buildItemRow(item));});
  adjustCardProportions();
}
function renderExpenseRows(){
  const filtered=items.filter(i=>i.type==='expense'&&(activeProfile==='shared'||matchProfile(i,activeProfile)));
  const total=filtered.filter(i=>i.on).reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,activeProfile),0);
  const lbl=document.getElementById('expense-total-label');
  if(lbl)lbl.textContent=fmtC(total);
  const wrap=document.getElementById('expense-rows');
  if(!wrap)return;
  wrap.innerHTML='';
  const cats={};
  filtered.forEach(item=>{const c=item.cat||'other';if(!cats[c])cats[c]=[];cats[c].push(item);});
  Object.entries(cats).forEach(([cat,citems])=>{
    const catTotal=citems.filter(i=>i.on).reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,activeProfile),0);
    const grp=document.createElement('div');grp.className='cat-group';
    grp.innerHTML=`<div class="cat-header"><span>${cat.charAt(0).toUpperCase()+cat.slice(1)}</span><span>${fmtC(catTotal)}</span></div>`;
    citems.forEach(item=>grp.appendChild(buildItemRow(item)));
    wrap.appendChild(grp);
  });
  adjustCardProportions();
}
function adjustCardProportions(){
  const inc=totalIncome(activeProfile),exp=totalExpenses(activeProfile),tot=inc+exp;
  if(tot>0){
    const ic=document.getElementById('income-card'),ec=document.getElementById('expense-card');
    if(ic)ic.style.minHeight=(120*Math.max(20,inc/tot*100)/50)+'px';
    if(ec)ec.style.minHeight=(120*Math.max(20,exp/tot*100)/50)+'px';
  }
}
function buildItemRow(item){
  const mv=toMonthly(item.val,item.freq);
  const maxV=Math.max(item.val*(item.type==='income'?2:3),50000);
  const days=getDaysUntil(item.dueDay);
  const buf=item.bufferDays||3;
  const dueBadge=item.dueDay>0?`<span class="due-badge ${days===0?'today':days!==null&&days<=buf?'soon':''}" onclick="editDueDay('${item.id}')" title="Click to edit due day">${days===0?'TODAY':days===null?'—':days+'d'}</span>`:'';
  const purposeHtml=item.purpose
    ?`<span class="purpose-badge ${PC[item.purpose]||''}" onclick="cyclePurpose('${item.id}')" title="Click to cycle purpose">${PL[item.purpose]||''}</span>`
    :`<span class="purpose-badge add" onclick="cyclePurpose('${item.id}')" title="Click to add purpose tag">+ tag</span>`;
  const sparkHtml=item.tag==='variable'||item.tag==='discretionary'?buildSparkline(item):'';
  const d=document.createElement('div');
  d.className='item-row';
  d.setAttribute('data-item-id',item.id);
  d.setAttribute('oncontextmenu',`showContextMenu(event,'${item.id}');return false;`);
  d.innerHTML=`<div class="item-head">
    <input type="checkbox" class="item-check" ${item.on?'checked':''} onchange="toggleItem('${item.id}',this.checked)">
    <div class="owner-dot ${item.owner||'shared'}" onclick="cycleOwner('${item.id}')" title="Click to change owner"></div>
    <span class="item-name ${item.on?'':'off'}" id="iname-${item.id}" onclick="startNameEdit('${item.id}',this)">${item.name}</span>
    ${purposeHtml}${dueBadge}${sparkHtml}
    <span class="item-amount ${item.on?'':'off'}" id="iamt-${item.id}" onclick="startAmtEdit('${item.id}',this)" title="Click to edit">${fmtC(Math.round(mv))}</span>
    <div class="item-edit-btns">
      <button class="item-edit-btn" onclick="openItemModal('${item.id}')" title="Edit all details"><i class="ti ti-pencil"></i></button>
    </div>
  </div>
  <div class="slider-row">
    <input type="range" min="0" max="${maxV}" step="${item.type==='income'?1000:500}" value="${item.val}" ${item.on?'':'disabled'} oninput="updateSlider('${item.id}',+this.value)">
    <span class="slider-max">${Math.round(maxV/1000)}k</span>
  </div>`;
  return d;
}

function buildSparkline(item){
  const hist=Object.entries(trackerData)
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .slice(-6)
    .map(([k,td])=>{
      const key=(item.type==='income'?'inc_':'exp_')+item.id;
      return td[key]!==undefined?+td[key]:null;
    }).filter(v=>v!==null);
  if(hist.length<2)return '';
  const maxV=Math.max(...hist,1);
  const w=40,h=16;
  const pts=hist.map((v,i)=>`${Math.round(i*(w/(hist.length-1))||0)},${Math.round(h-v/maxV*h)}`).join(' ');
  const lastTrend=hist.length>=2?(hist[hist.length-1]>hist[hist.length-2]?'var(--danger)':'var(--accent)'):'var(--text3)';
  return `<span class="sparkline-wrap" title="Last ${hist.length} months">
    <svg width="${w}" height="${h}" style="display:inline-block;vertical-align:middle;opacity:0.7;">
      <polyline points="${pts}" fill="none" stroke="${lastTrend}" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </span>`;
}

function startNameEdit(id,el){

  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')recalc();};
  el.replaceWith(inp);inp.focus();inp.select();
}
function startAmtEdit(id,el){
  const item=items.find(i=>i.id===id);if(!item||!item.on)return;
  const inp=document.createElement('input');
  inp.className='item-amount-edit';inp.type='number';inp.value=item.val;
  inp.onblur=()=>{const nv=+inp.value||0;if(nv!==item.val){logItemHistory(item,item.val,nv,'val');item.val=nv;}recalc();};
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')recalc();};

function editDueDay(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  const v=prompt(`Due day for "${item.name}" (1-31, 0 = none):`,item.dueDay||0);

  item.dueDay=Math.max(0,Math.min(31,+v||0));

function toggleItem(id,on){const item=items.find(i=>i.id===id);if(item){item.on=on;recalc();}}
function updateSlider(id,val){
  const item=items.find(i=>i.id===id);if(!item)return;

function cycleOwner(id){

function globalCycleOwner(id){cycleOwner(id);renderGlobalTable();}
function globalDelete(id){if(!confirm('Remove this item?'))return;items=items.filter(i=>i.id!==id);renderGlobalTable();recalc();}

function updateCatChart(){
  const order=['obligations','transport','lifestyle','wellbeing','subscriptions','other'];
  const labels=[],data=[],colors=[];
  [...order,...new Set(items.filter(i=>i.type==='expense'&&!order.includes(i.cat||'other')).map(i=>i.cat||'other'))].forEach(c=>{
    const t=items.filter(i=>i.type==='expense'&&(i.cat||'other')===c&&i.on&&matchProfile(i,activeProfile))
      .reduce((s,i)=>s+toMonthly(i.val,i.freq)*profileShare(i,activeProfile),0);
    if(t>0){labels.push(c.charAt(0).toUpperCase()+c.slice(1));data.push(Math.round(t));colors.push(CAT_COLORS[c]||CAT_COLORS.other);}
  });
  const el=document.getElementById('cat-legend');
  if(el)el.innerHTML=labels.map((l,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${colors[i]}"></div>${l}</div>`).join('');
  const canvas=document.getElementById('catChart');if(!canvas)return;
  if(!catChart){
    catChart=new Chart(canvas,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtC(c.raw)}}},
        scales:{x:{grid:{color:'rgba(128,128,128,0.07)'},ticks:{callback:v=>fmt(v),font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  } else {
    catChart.data.labels=labels;catChart.data.datasets[0].data=data;catChart.data.datasets[0].backgroundColor=colors;catChart.update('none');
  }
}

// CASH FLOW
// ════════════════════════════════════════════════════════════════
function renderCashFlow(){
  const bal=accountBalance;
  const disp=document.getElementById('cf-balance-display');
  if(disp)disp.textContent=bal?fmtC(bal):'Not set — click Set to enter';
  const events=[];
  items.filter(i=>i.on&&i.dueDay>0).forEach(item=>{
    const mv=Math.round(toMonthly(item.val,item.freq));
    if(mv===0)return;
    const days=getDaysUntil(item.dueDay);
    events.push({day:item.dueDay,name:item.name,amount:mv,type:item.type,owner:item.owner,daysUntil:days,itemId:item.id,purpose:item.purpose});
  });
  events.sort((a,b)=>a.day-b.day);
  // Due soon
  const soon=events.filter(e=>e.daysUntil!==null&&e.daysUntil<=7&&e.type==='expense').sort((a,b)=>a.daysUntil-b.daysUntil);
  const dsl=document.getElementById('due-soon-list');
  if(dsl)dsl.innerHTML=soon.length===0?'<div style="font-size:12px;color:var(--text3);">No payments due in the next 7 days.</div>':
    soon.map(e=>`<div class="due-soon-item ${e.daysUntil===0?'urgent':e.daysUntil<=3?'soon':''}">
      <div class="owner-dot ${e.owner||'shared'}"></div>
      <span style="flex:1;">${e.name}</span>
      <span style="font-weight:600;">${fmtC(e.amount)}</span>
      <span style="font-size:10px;color:var(--text2);">${e.daysUntil===0?'TODAY':e.daysUntil+'d'}</span>
    </div>`).join('');
  // Timeline track
  const track=document.getElementById('cf-track');
  if(track){
    track.innerHTML='';
    events.forEach(e=>{
      const pct=((e.day-1)/29)*100;
      const color=e.type==='income'?(USERS[e.owner]?.color||'var(--accent)'):(e.purpose==='saving'?'var(--accent)':'var(--danger)');
      const marker=document.createElement('div');
      marker.className='cf-event-marker';
      marker.style.cssText=`position:absolute;left:${pct}%;transform:translateX(-50%);top:0;bottom:0;display:flex;flex-direction:column;align-items:center;`;
      marker.innerHTML=`<div class="cf-dot" style="background:${color};" title="${e.name}: ${fmtC(e.amount)} on day ${e.day}">${e.type==='income'?'↑':'↓'}</div>
        <div class="cf-dot-label">${e.name.split(' ')[0]}</div>`;
      track.appendChild(marker);
    });
  }
  // Balance curve
  const balCurve=[];let running=bal||0;
  for(let d=1;d<=30;d++){
    events.forEach(e=>{if(e.day===d)running+=e.type==='income'?e.amount:-e.amount;});
    balCurve.push(running);
  }
  const cfCanvas=document.getElementById('cfChart');
  if(cfCanvas){
    if(cfChart){cfChart.destroy();cfChart=null;}
    const posColor=balCurve[29]>=(bal||0)?'var(--accent)':'var(--danger)';
    cfChart=new Chart(cfCanvas,{type:'line',
      data:{labels:Array.from({length:30},(_,i)=>'Day '+(i+1)),datasets:[{
        data:balCurve,borderColor:posColor,backgroundColor:posColor==='var(--accent)'?'rgba(29,158,117,0.08)':'rgba(226,75,74,0.08)',
        tension:0.3,fill:true,pointRadius:0,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtC(c.raw)}}},
        scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,font:{size:10}}},
          y:{grid:{color:'rgba(128,128,128,0.07)'},ticks:{callback:v=>fmt(v),font:{size:10}}}}}});
  }
  // Event list table
  const evList=document.getElementById('cf-event-list');
  if(evList)evList.innerHTML=events.length===0?
    '<div class="empty-state">Set due days on items to see the timeline. Click any due badge on the Dashboard.</div>':
    `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="background:var(--surface2);"><th style="padding:6px 8px;text-align:left;">Day</th><th style="padding:6px 8px;">Name</th><th style="padding:6px 8px;text-align:right;">Amount</th><th style="padding:6px 8px;">Type</th><th style="padding:6px 8px;">Days away</th></tr></thead>
      <tbody>${events.map(e=>`<tr style="border-bottom:1px solid var(--border2);">
        <td style="padding:6px 8px;font-weight:600;">Day ${e.day}</td>
        <td style="padding:6px 8px;">${e.name}</td>
        <td style="padding:6px 8px;text-align:right;" class="${e.type==='income'?'var-pos':'var-neg'}">${e.type==='income'?'+':'-'}${fmtC(e.amount)}</td>
        <td style="padding:6px 8px;"><span class="tag-badge ${e.type==='income'?'tag-fixed':'tag-variable'}">${e.type}</span></td>
        <td style="padding:6px 8px;">${e.daysUntil===0?'<span style="color:var(--danger);font-weight:700;">TODAY</span>':e.daysUntil===null?'—':e.daysUntil+'d'}</td>
      </tr>`).join('')}</tbody>
    </table>`;
}

  document.getElementById('balance-input').value=accountBalance||'';

}

// TRACKER
// ════════════════════════════════════════════════════════════════
function initTracker(){
  const y=document.getElementById('tracker-year');if(!y)return;
  const now=new Date();
  for(let yr=now.getFullYear()-3;yr<=now.getFullYear()+2;yr++){
    const o=document.createElement('option');o.value=yr;o.textContent=yr;
    if(yr===now.getFullYear())o.selected=true;
    y.appendChild(o);
  }
  document.getElementById('tracker-month').value=now.getMonth();
}

function renderTracker(){
  const month=+document.getElementById('tracker-month').value;
  const year=+document.getElementById('tracker-year').value;
  const tkey=getTkey(month,year);
  if(!trackerData[tkey])trackerData[tkey]={};
  const td=trackerData[tkey];
  // notes
  const notesEl=document.getElementById('month-notes');
  if(notesEl)notesEl.value=monthNotes[tkey]||'';
  const body=document.getElementById('tracker-body');
  if(!body)return;
  const incItems=items.filter(i=>i.type==='income');
  const expItems=items.filter(i=>i.type==='expense');
  let tBI=0,tAI=0,tBE=0,tAE=0;
  // Income section
  let incRows='';
  incItems.forEach(item=>{
    const b=item.on?Math.round(toMonthly(item.val,item.freq)):0;
    const a=td['inc_'+item.id]!==undefined?td['inc_'+item.id]:'';
    const v=a!==''?+a-b:null;
    tBI+=b;if(a!=='')tAI+=+a;
    incRows+=buildTrackerRow(item,'inc_',b,a,v,month,year,tkey);
  });
  // Expense section
  let expRows='';
  expItems.forEach(item=>{
    const b=item.on?Math.round(toMonthly(item.val,item.freq)):0;
    const a=td['exp_'+item.id]!==undefined?td['exp_'+item.id]:'';
    const v=a!==''?b-+a:null;
    tBE+=b;if(a!=='')tAE+=+a;
    expRows+=buildTrackerRow(item,'exp_',b,a,v,month,year,tkey);
  });
  const bNet=tBI-tBE,aNet=(tAI&&tAE)?tAI-tAE:null;
  body.innerHTML=`
  <!-- Income section -->
  <div class="tracker-section">
    <div class="tracker-section-header">
      <span class="tracker-section-title">Income</span>
      <span class="tracker-section-total var-pos">${fmtC(tBI)} budgeted${tAI?` · ${fmtC(tAI)} actual`:''}</span>
    </div>
    <div class="tracker-table-wrap">
      <table class="tracker-table">
        <thead><tr><th>Item</th><th>Owner</th><th>Budget</th><th>Actual</th><th>Variance</th><th>Event</th></tr></thead>
        <tbody>${incRows}</tbody>
        <tfoot><tr class="tracker-summary-row">
          <td colspan="2">Total income</td>
          <td>${fmtC(tBI)}</td>
          <td>${tAI?fmtC(tAI):'—'}</td>
          <td class="${tAI?tAI-tBI>=0?'var-pos':'var-neg':''}">${tAI?fmtS(tAI-tBI):'—'}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>
  </div>
  <!-- Expense section -->
  <div class="tracker-section">
    <div class="tracker-section-header">
      <span class="tracker-section-title">Expenses</span>
      <span class="tracker-section-total var-neg">${fmtC(tBE)} budgeted${tAE?` · ${fmtC(tAE)} actual`:''}</span>
    </div>
    <div class="tracker-table-wrap">
      <table class="tracker-table">
        <thead><tr><th>Item</th><th>Owner</th><th>Budget</th><th>Actual</th><th>Variance</th><th>Event</th></tr></thead>
        <tbody>${expRows}</tbody>
        <tfoot><tr class="tracker-summary-row">
          <td colspan="2">Total expenses</td>
          <td>${fmtC(tBE)}</td>
          <td>${tAE?fmtC(tAE):'—'}</td>
          <td class="${tAE?tBE-tAE>=0?'var-pos':'var-neg':''}">${tAE?fmtS(tBE-tAE):'—'}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>
  </div>
  <!-- Net balance -->
  <div class="tracker-section">
    <div class="tracker-section-header" style="background:${bNet>=0?'var(--accent-light)':'var(--danger-light)'};">
      <span class="tracker-section-title" style="color:${bNet>=0?'var(--accent-dark)':'var(--danger)'};">Net balance</span>
      <span class="tracker-section-total ${bNet>=0?'var-pos':'var-neg'}">${fmtS(bNet)} budgeted${aNet!==null?` · ${fmtS(aNet)} actual`:''}</span>
    </div>
  </div>`;
}

function buildTrackerRow(item,prefix,b,a,v,month,year,tkey){
  const routeTag=getRoutedTag(tkey,prefix+item.id);
  const pill=buildSurplusPill(prefix+item.id,v,month,year,item);
  const purposeTag=item.purpose?`<span class="purpose-badge ${PC[item.purpose]||''}" style="font-size:9px;margin-left:4px;" onclick="cyclePurpose('${item.id}')">${PL[item.purpose]||''}</span>`:'';
  return `<tr oncontextmenu="showTrackerContextMenu(event,'${item.id}','${prefix}');return false;">
    <td>
      <span class="tracker-editable" onclick="startTrackerNameEdit('${item.id}',this)">${item.name}</span>${purposeTag}
    </td>
    <td><div class="owner-dot ${item.owner||'shared'}" style="display:inline-block;" onclick="cycleOwner('${item.id}')" title="Click to change owner"></div></td>
    <td><span class="tracker-editable" onclick="startTrackerBudgetEdit('${item.id}',this,${b})">${fmtC(b)}</span></td>
    <td style="padding:3px 6px;"><input class="actual" type="number" placeholder="—" value="${a}" data-key="${prefix+item.id}" data-month="${month}" data-year="${year}" oninput="updateActual(this)"></td>
    <td class="${v===null?'':v>=0?'var-pos':'var-neg'}">${v===null?'—':fmtS(v)}</td>
    <td>${pill}${routeTag}</td>
  </tr>`;
}

function startTrackerNameEdit(id,el){
  const item=items.find(i=>i.id===id);if(!item)return;
  const inp=document.createElement('input');
  inp.style.cssText='width:100%;padding:2px 5px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;';
  inp.value=item.name;
  inp.onblur=()=>{if(inp.value.trim()&&inp.value!==item.name){logItemHistory(item,item.name,inp.value,'name');item.name=inp.value.trim();renderTracker();}else el.replaceWith(document.createTextNode(item.name));};
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){el.textContent=item.name;inp.replaceWith(el);}};
  el.replaceWith(inp);inp.focus();inp.select();
}

function startTrackerBudgetEdit(id,el,currentBudget){
  const item=items.find(i=>i.id===id);if(!item)return;
  const inp=document.createElement('input');
  inp.type='number';
  inp.style.cssText='width:90px;padding:2px 5px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;';
  inp.value=item.val;
  inp.onblur=()=>{const nv=+inp.value||0;if(nv!==item.val){logItemHistory(item,item.val,nv,'val');item.val=nv;renderTracker();recalc();}else el.textContent=fmtC(currentBudget);};
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){el.textContent=fmtC(currentBudget);inp.replaceWith(el);}};
  el.replaceWith(inp);inp.focus();inp.select();
}

function buildSurplusPill(itemKey,variance,month,year,item){
  if(variance===null||variance===0)return '';
  const pos=variance>0;
  const existingEvent=txEvents.find(e=>e.sourceKey===itemKey&&e.month===month&&e.year===year);
  if(existingEvent){
    const sc=existingEvent.status==='tagged'?'var(--accent)':existingEvent.status==='carried'?'var(--purple)':'var(--warning)';
    return `<span class="surplus-pill" style="background:${sc}15;color:${sc};border:1px solid ${sc};" onclick="showTab('events')"><i class="ti ti-git-branch" style="font-size:9px;"></i> ${existingEvent.status}</span>`;
  }
  return `<span class="surplus-pill ${pos?'positive':'negative'}" onclick="openRouteModal('${itemKey}',${variance},${month},${year},'${item?.id||''}','${item?.name||''}')">
    <i class="ti ${pos?'ti-sparkles':'ti-alert-triangle'}" style="font-size:9px;"></i> ${pos?'+':'−'}${fmt(Math.abs(variance))}
  </span>`;
}

function getRoutedTag(tkey,itemKey){
  const r=(trackerData[tkey]?.routes||{})[itemKey];if(!r)return '';
  let lbl='';
  if(r.type==='savings'){const s=savingsStreams.find(x=>x.id===r.target);lbl=`→ ${s?s.name:'stream'}`;}
  else if(r.type==='income_boost')lbl='→ income pool';
  else if(r.type==='expense')lbl=`→ ${r.targetName||'expense'}`;
  else if(r.type==='instrument')lbl=`→ ${r.targetName||'instrument'}`;
  return `<span style="font-size:9px;color:var(--accent-dark);background:var(--accent-light);padding:1px 5px;border-radius:99px;margin-left:3px;">${lbl}</span>`;
}

function updateActual(el){
  const month=+el.dataset.month,year=+el.dataset.year,key=el.dataset.key;
  const tkey=getTkey(month,year);
  if(!trackerData[tkey])trackerData[tkey]={};
  trackerData[tkey][key]=el.value!==''?+el.value:'';
  // re-render just the pill in this row without full re-render for performance
  renderTracker();
}
function resetTrackerMonth(){
  const m=+document.getElementById('tracker-month').value,y=+document.getElementById('tracker-year').value;
  if(!confirm('Reset all actuals for this month?'))return;
  trackerData[getTkey(m,y)]={};renderTracker();markDirty();
}
function saveMonthNote(v){
  const m=+document.getElementById('tracker-month').value,y=+document.getElementById('tracker-year').value;
  monthNotes[getTkey(m,y)]=v;markDirty();
}

// ════════════════════════════════════════════════════════════════
// ROUTE MODAL
// ════════════════════════════════════════════════════════════════
function openRouteModal(itemKey,amount,month,year,itemId,itemName){
  routeCtx={itemKey,amount,month,year,itemId,itemName};routeChoice=null;
  const pos=amount>0;
  const titleEl=document.getElementById('route-title');
  if(titleEl)titleEl.textContent=pos?'Route surplus':'Log overspend';
  const disp=document.getElementById('route-amount-display');
  if(disp){
    disp.textContent=(pos?'Surplus + ':'Overspend − ')+fmtC(Math.abs(amount))+' — '+(itemName||'');
    disp.style.cssText=`padding:9px 12px;border-radius:var(--radius);font-size:13px;font-weight:700;margin-bottom:14px;background:${pos?'var(--accent-light)':'var(--danger-light)'};color:${pos?'var(--accent-dark)':'var(--danger)'};`;
  }
  const opts=document.getElementById('route-opts');
  if(opts){
    if(pos){
      opts.innerHTML=`
        <button class="route-btn" id="rb-savings" onclick="selectRoute('savings')"><div class="route-icon" style="background:var(--accent-light);color:var(--accent);"><i class="ti ti-piggy-bank"></i></div><div><strong>Savings stream</strong><div style="font-size:10px;color:var(--text2);">Route into a named savings pot</div></div></button>
        <button class="route-btn" id="rb-income" onclick="selectRoute('income_boost')"><div class="route-icon" style="background:var(--info-light);color:var(--info);"><i class="ti ti-trending-up"></i></div><div><strong>Extra income</strong><div style="font-size:10px;color:var(--text2);">Add to this month's income</div></div></button>
        <button class="route-btn" id="rb-expense" onclick="selectRoute('expense')"><div class="route-icon" style="background:var(--warning-light);color:var(--warning);"><i class="ti ti-arrow-right"></i></div><div><strong>Tag to expense</strong><div style="font-size:10px;color:var(--text2);">Assign toward another budget line</div></div></button>
        <button class="route-btn" id="rb-instr" onclick="selectRoute('instrument')"><div class="route-icon" style="background:var(--gold-light);color:var(--gold);"><i class="ti ti-chart-line"></i></div><div><strong>Overpay instrument</strong><div style="font-size:10px;color:var(--text2);">Apply to loan, FD or investment</div></div></button>
        <button class="route-btn" id="rb-carry" onclick="selectRoute('carry')"><div class="route-icon" style="background:var(--purple-light);color:var(--purple);"><i class="ti ti-calendar-plus"></i></div><div><strong>Carry forward</strong><div style="font-size:10px;color:var(--text2);">Tag later — appears in Events</div></div></button>`;
    } else {
      opts.innerHTML=`<div style="font-size:12px;color:var(--text2);padding:10px;background:var(--surface2);border-radius:var(--radius);">Over budget by ${fmtC(Math.abs(amount))}. This will be logged as an overspend event.</div>`;
    }
  }
  ['rss','rse','rsi'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('visible');});
  document.getElementById('route-overlay').classList.add('open');
}
function selectRoute(type){
  routeChoice=type;
  document.querySelectorAll('.route-btn').forEach(b=>b.classList.remove('selected'));
  const el=document.getElementById('rb-'+type);if(el)el.classList.add('selected');
  ['rss','rse','rsi'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('visible');});
  if(type==='savings'){
    const sel=document.getElementById('rss-sel');
    if(sel)sel.innerHTML=savingsStreams.length===0?'<option>No streams yet — go to Savings tab</option>':
      savingsStreams.map(s=>`<option value="${s.id}">${s.name} (${fmtC(s.balance)})</option>`).join('');
    const rss=document.getElementById('rss');if(rss)rss.classList.add('visible');
  }
  if(type==='expense'){
    const sel=document.getElementById('rse-sel');
    if(sel)sel.innerHTML=items.filter(i=>i.type==='expense'&&i.on).map(i=>`<option value="${i.id}">${i.name} — ${fmtC(Math.round(toMonthly(i.val,i.freq)))}</option>`).join('');
    const rse=document.getElementById('rse');if(rse)rse.classList.add('visible');
  }
  if(type==='instrument'){
    const sel=document.getElementById('rsi-sel');
    if(sel)sel.innerHTML=instruments.length===0?'<option>No instruments yet</option>':
      instruments.map(i=>`<option value="${i.id}">${i.name}</option>`).join('');
    const rsi=document.getElementById('rsi');if(rsi)rsi.classList.add('visible');
  }
}
function confirmRoute(){
  if(!routeCtx)return;
  const {itemKey,amount,month,year,itemId,itemName}=routeCtx;
  const tkey=getTkey(month,year);
  if(!trackerData[tkey])trackerData[tkey]={};
  if(!trackerData[tkey].routes)trackerData[tkey].routes={};
  const dateLabel=`${MS[month]} ${year}`;
  const evt={id:uid(),sourceKey:itemKey,sourceItem:itemName,amount,month,year,dateLabel,
    status:routeChoice==='carry'?'carried':'tagged',routeType:routeChoice,
    routeTarget:null,routeTargetName:'',chain:[{label:itemName,amount,date:dateLabel}],created:Date.now()};
  if(routeChoice==='savings'){
    const sid=document.getElementById('rss-sel').value;
    if(!sid||sid.startsWith('No'))return;
    const stream=savingsStreams.find(s=>s.id===sid);if(!stream)return;
    stream.balance+=amount;
    if(!stream.history)stream.history=[];
    stream.history.unshift({date:dateLabel,amount,from:itemKey});
    evt.routeTarget=sid;evt.routeTargetName=stream.name;
    evt.chain.push({label:'→ '+stream.name,amount,date:dateLabel});
    trackerData[tkey].routes[itemKey]={type:'savings',target:sid};
    scheduleCalendarEvent(itemName,amount,month,year,'savings',stream.name);
  } else if(routeChoice==='income_boost'){
    evt.routeTargetName='Income pool';
    evt.chain.push({label:'→ Income pool',amount,date:dateLabel});
    trackerData[tkey].routes[itemKey]={type:'income_boost'};
  } else if(routeChoice==='expense'){
    const eid=document.getElementById('rse-sel').value;
    const expItem=items.find(i=>i.id===eid);
    evt.routeTarget=eid;evt.routeTargetName=expItem?.name||'?';
    evt.chain.push({label:'→ '+(expItem?.name||'?'),amount,date:dateLabel});
    trackerData[tkey].routes[itemKey]={type:'expense',target:eid,targetName:expItem?.name};
  } else if(routeChoice==='instrument'){
    const iid=document.getElementById('rsi-sel').value;
    const instr=instruments.find(i=>i.id===iid);
    evt.routeTarget=iid;evt.routeTargetName=instr?.name||'?';
    evt.chain.push({label:'→ '+(instr?.name||'?'),amount,date:dateLabel});
    trackerData[tkey].routes[itemKey]={type:'instrument',target:iid,targetName:instr?.name};
  } else if(routeChoice==='carry'){
    evt.status='carried';evt.routeTargetName='Carried forward';
  }
  txEvents.unshift(evt);
  closeRouteModal();renderTracker();renderDashSavings();updateEventsBadge();markDirty();
}
function closeRouteModal(){document.getElementById('route-overlay').classList.remove('open');routeCtx=null;routeChoice=null;}

// ════════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════════
function updateEventsBadge(){
  const n=txEvents.filter(e=>e.status==='untagged'||e.status==='carried').length;
  const badge=document.getElementById('events-badge');
  if(badge){badge.textContent=n;badge.style.display=n>0?'inline':'none';}
  const banner=document.getElementById('events-banner');
  if(banner)banner.style.display=n>0?'flex':'none';
  const txt=document.getElementById('events-banner-text');
  if(txt&&n>0)txt.textContent=`${n} event${n>1?'s':''} awaiting action`;
}
function renderEvents(){
  const filter=document.getElementById('events-filter')?.value||'all';
  let evts=[...txEvents];
  if(filter==='untagged')evts=evts.filter(e=>e.status==='untagged');
  else if(filter==='tagged')evts=evts.filter(e=>e.status==='tagged');
  else if(filter==='carried')evts=evts.filter(e=>e.status==='carried');
  const el=document.getElementById('events-list');if(!el)return;
  if(!evts.length){el.innerHTML='<div class="empty-state">No events yet. Enter actuals in the Tracker to generate surplus events.</div>';return;}
  el.innerHTML=evts.map(evt=>{
    const pos=evt.amount>0;
    const sc=evt.status==='tagged'?'var(--accent)':evt.status==='carried'?'var(--purple)':'var(--warning)';
    const chainHtml=evt.chain&&evt.chain.length>1?`
      <div class="event-chain">
        <div class="event-chain-title" onclick="this.nextElementSibling.classList.toggle('open')">
          <i class="ti ti-git-branch" style="font-size:10px;"></i> Chain (${evt.chain.length} nodes) <i class="ti ti-chevron-down" style="font-size:9px;"></i>
        </div>
        <div class="event-chain-body">
          ${(evt.chain||[]).map((node,i)=>`<div class="chain-node">${i>0?'<span class="chain-arrow">→</span>':''}<span>${node.label}</span><span style="margin-left:auto;font-size:11px;color:var(--text2);">${fmtC(node.amount)}</span></div>`).join('')}
        </div>
      </div>`:'';
    return `<div class="event-card ${evt.status}">
      <div class="event-head">
        <div>
          <div class="event-name">${evt.sourceItem||'Event'}</div>
          <div class="event-meta">
            <span>${evt.dateLabel||''}</span>
            <span style="background:${sc}15;color:${sc};padding:1px 6px;border-radius:99px;font-size:10px;">${evt.status}</span>
            ${evt.routeTargetName?`<span>→ ${evt.routeTargetName}</span>`:''}
          </div>
        </div>
        <div class="event-amount ${pos?'pos':'neg'}">${pos?'+':'−'}${fmtC(Math.abs(evt.amount))}</div>
      </div>
      ${chainHtml}
      ${evt.status==='carried'?`<div style="margin-top:8px;"><button class="btn btn-sm btn-accent" onclick="rerouteEvent('${evt.id}')"><i class="ti ti-arrow-right"></i> Route now</button></div>`:''}
    </div>`;
  }).join('');
}
function rerouteEvent(evtId){
  const evt=txEvents.find(e=>e.id===evtId);if(!evt)return;
  txEvents=txEvents.filter(e=>e.id!==evtId);
  openRouteModal(evt.sourceKey,evt.amount,evt.month,evt.year,evt.sourceItem,evt.sourceItem);
}
function carryForwardEvents(){
  const now=new Date();
  txEvents.filter(e=>e.status==='carried').forEach(e=>{
    if(e.year<now.getFullYear()||(e.year===now.getFullYear()&&e.month<now.getMonth())){
      if(!e.chain)e.chain=[];
      e.chain.push({label:'Carried to '+MS[now.getMonth()]+' '+now.getFullYear(),amount:e.amount,date:MS[now.getMonth()]+' '+now.getFullYear()});
      e.month=now.getMonth();e.year=now.getFullYear();e.dateLabel=MS[now.getMonth()]+' '+now.getFullYear();
    }
  });
}

// SAVINGS
// ════════════════════════════════════════════════════════════════
function ensureSavingStreams(){
  // auto-create streams for saving-tagged items that don't have a stream yet
  items.filter(i=>i.on&&i.purpose==='saving').forEach(item=>{
    const exists=savingsStreams.find(s=>s.name.toLowerCase()===item.name.toLowerCase());
    if(!exists&&item.val>0){
      savingsStreams.push({id:uid(),name:item.name,goal:0,color:item.owner==='dulini'?'#D4537E':'#1D9E75',owner:item.owner||'shared',balance:0,history:[]});
    }
  });
}
function renderSavings(){
  const filtered=savingsStreams.filter(s=>activeProfile==='shared'||s.owner===activeProfile||s.owner==='shared');
  const totalAll=savingsStreams.reduce((x,s)=>x+s.balance,0);
  const totalT=savingsStreams.filter(s=>s.owner==='trevin'||s.owner==='shared').reduce((x,s)=>x+s.balance,0);
  const totalD=savingsStreams.filter(s=>s.owner==='dulini'||s.owner==='shared').reduce((x,s)=>x+s.balance,0);
  const sm=document.getElementById('savings-metrics');
  if(sm)sm.innerHTML=`
    <div class="metric-card"><div class="metric-label">Total saved</div><div class="metric-val green">${fmtC(totalAll)}</div><div class="metric-sub">all streams</div></div>
    <div class="metric-card"><div class="metric-label">Trevin</div><div class="metric-val" style="color:var(--trevin);">${fmtC(totalT)}</div></div>
    <div class="metric-card"><div class="metric-label">Dulini</div><div class="metric-val" style="color:var(--dulini);">${fmtC(totalD)}</div></div>
    <div class="metric-card"><div class="metric-label">Streams</div><div class="metric-val">${savingsStreams.length}</div></div>`;
  const grid=document.getElementById('savings-grid');
  const empty=document.getElementById('savings-empty');
  if(!filtered.length){if(grid)grid.style.display='none';if(empty)empty.style.display='block';return;}
  if(grid)grid.style.display='grid';if(empty)empty.style.display='none';
  if(grid)grid.innerHTML=filtered.map(s=>{
    const pct=s.goal>0?Math.min(100,(s.balance/s.goal)*100):0;
    const oc=USERS[s.owner]?.color||'var(--shared)';
    return `<div class="stream-card">
      <div class="stream-actions">
        <button class="stream-del" onclick="openStreamModal('${s.id}')"><i class="ti ti-pencil"></i></button>
        <button class="stream-del" onclick="deleteStream('${s.id}')"><i class="ti ti-trash"></i></button>
      </div>
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;">
        <div class="owner-dot ${s.owner||'shared'}" style="width:7px;height:7px;"></div>
        <div class="stream-name" onclick="promptStreamRename('${s.id}')">${s.name}</div>
      </div>
      <div class="stream-amount" style="color:${s.color||oc};" onclick="promptStreamBalance('${s.id}')">${fmtC(s.balance)}</div>
      ${s.goal>0?`<div class="stream-bar-track"><div class="stream-bar-fill" style="width:${pct}%;background:${s.color||oc};"></div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:3px;">Goal ${fmtC(s.goal)} — ${pct.toFixed(0)}%</div>`:'<div style="font-size:10px;color:var(--text3);">No goal set</div>'}
      <div class="stream-history">${(s.history||[]).slice(0,6).map(h=>`<div class="stream-history-item"><span>${h.date}</span><span style="color:var(--accent);">+${fmtC(h.amount)}</span></div>`).join('')||'<span>No entries yet</span>'}</div>
    </div>`;
  }).join('');
  renderSavingsProjections();
}
function promptStreamRename(id){
  const s=savingsStreams.find(x=>x.id===id);if(!s)return;
  const v=prompt('Rename stream:',s.name);
  if(v&&v.trim()&&v!==s.name){s.name=v.trim();renderSavings();renderDashSavings();markDirty();}
}
function promptStreamBalance(id){
  const s=savingsStreams.find(x=>x.id===id);if(!s)return;
  const v=prompt(`Adjust balance for "${s.name}":`,s.balance);
  if(v!==null&&+v>=0){s.balance=+v;renderSavings();renderDashSavings();markDirty();}
}
function renderSavingsProjections(){
  const el=document.getElementById('savings-projections');if(!el)return;
  const streams=savingsStreams.filter(s=>s.goal>0);
  if(!streams.length){el.innerHTML='';return;}
  const monthlyTagged=items.filter(i=>i.purpose==='saving'&&i.on).reduce((x,i)=>x+toMonthly(i.val,i.freq),0);
  const loanClears=instruments.find(i=>i.type==='loan'&&i.start&&i.period);
  el.innerHTML=`<div class="card" style="margin-bottom:14px;">
    <div class="card-head"><span class="card-title">Goal projections</span></div>
    ${streams.map(s=>{
      const remaining=Math.max(0,s.goal-s.balance);
      const moA=remaining>0&&monthlyTagged>0?Math.ceil(remaining/monthlyTagged):null;
      const loanExtra=loanClears?Math.round(toMonthly(loanClears.monthly||0,loanClears.freq||'monthly')):0;
      const moB=remaining>0&&(monthlyTagged+loanExtra)>0?Math.ceil(remaining/(monthlyTagged+loanExtra)):null;
      const surplusExtra=Math.max(0,totalIncome('shared')-totalExpenses('shared'));
      const moC=remaining>0&&(monthlyTagged+surplusExtra)>0?Math.ceil(remaining/(monthlyTagged+surplusExtra)):null;
      const pct=Math.min(100,(s.balance/s.goal)*100);
      return `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;">
          <span>${s.name}</span><span style="color:${s.color||'var(--accent)'};">${pct.toFixed(0)}% of ${fmtC(s.goal)}</span>
        </div>
        <div class="velocity-bar"><div class="velocity-fill" style="width:${pct}%;background:${s.color||'var(--accent)'};"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;">
          <div style="background:var(--surface2);border-radius:8px;padding:8px;text-align:center;font-size:11px;"><div style="color:var(--text3);margin-bottom:2px;">At current rate</div><strong>${moA?moA+' mo':'—'}</strong></div>
          <div style="background:var(--surface2);border-radius:8px;padding:8px;text-align:center;font-size:11px;"><div style="color:var(--text3);margin-bottom:2px;">+ loan cleared</div><strong>${moB&&moB<(moA||999)?moB+' mo':'—'}</strong></div>
          <div style="background:var(--surface2);border-radius:8px;padding:8px;text-align:center;font-size:11px;"><div style="color:var(--text3);margin-bottom:2px;">+ surplus routed</div><strong>${moC&&moC<(moA||999)?moC+' mo':'—'}</strong></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function openStreamModal(editId){
  editStreamId=editId||null;
  const s=editId?savingsStreams.find(x=>x.id===editId):null;
  const t=document.getElementById('stream-modal-title');if(t)t.textContent=s?'Edit stream':'New savings stream';
  const sn=document.getElementById('stream-name');if(sn)sn.value=s?.name||'';
  const sg=document.getElementById('stream-goal');if(sg)sg.value=s?.goal||'';
  const sc=document.getElementById('stream-color');if(sc)sc.value=s?.color||'#1D9E75';
  const so=document.getElementById('stream-owner');if(so)so.value=s?.owner||'shared';
  const sdb=document.getElementById('stream-delete-btn');if(sdb)sdb.style.display=editId?'':'none';
  document.getElementById('stream-overlay').classList.add('open');
}
function closeStreamModal(){document.getElementById('stream-overlay').classList.remove('open');editStreamId=null;}
function saveStream(){
  const name=document.getElementById('stream-name').value.trim();if(!name){alert('Enter a name.');return;}
  const s={id:editStreamId||uid(),name,goal:+document.getElementById('stream-goal').value||0,
    color:document.getElementById('stream-color').value,owner:document.getElementById('stream-owner').value,
    balance:editStreamId?savingsStreams.find(x=>x.id===editStreamId)?.balance||0:0,
    history:editStreamId?savingsStreams.find(x=>x.id===editStreamId)?.history||[]:[]};
  if(editStreamId){const idx=savingsStreams.findIndex(x=>x.id===editStreamId);if(idx>=0)savingsStreams[idx]=s;}
  else savingsStreams.push(s);
  closeStreamModal();renderSavings();renderDashSavings();markDirty();
}
function deleteStream(id){if(!confirm('Delete this stream?'))return;savingsStreams=savingsStreams.filter(s=>s.id!==id);renderSavings();renderDashSavings();markDirty();}
function deleteCurrentStream(){if(editStreamId)deleteStream(editStreamId);}

// Settlement
function renderSettlement(){
  const panel=document.getElementById('settlement-panel');if(!panel)return;
  let tOwes=0,dOwes=0;
  items.filter(i=>i.type==='expense'&&i.on&&i.owner==='shared').forEach(item=>{
    const mv=Math.round(toMonthly(item.val,item.freq));
    const tr=(item.splitRatio?.trevin??50)/100;
    const dr=(item.splitRatio?.dulini??50)/100;
    // simple model: assume Trevin paid all shared items
    dOwes+=mv*dr;
  });
  const net=dOwes-tOwes;
  if(net===0){panel.style.display='none';return;}
  panel.style.display='block';
  const amtEl=document.getElementById('settlement-amount');
  if(amtEl){amtEl.textContent=fmtC(Math.abs(net));amtEl.style.color=net>0?'var(--dulini)':'var(--trevin)';}
  const detEl=document.getElementById('settlement-detail');
  if(detEl)detEl.textContent=net>0?`Dulini owes Trevin ${fmtC(net)} this month based on shared expense splits.`:`Trevin owes Dulini ${fmtC(Math.abs(net))} this month.`;
}
function markSettled(){
  const now=new Date();
  const key=getTkey(now.getMonth(),now.getFullYear());
  settlementHistory.push({month:key,date:new Date().toLocaleDateString('en-LK'),settled:true});
  if(!monthHistory[key])monthHistory[key]={};
  monthHistory[key].settled=true;
  renderSettlement();markDirty();
  alert('Marked as settled for this month.');
}

// ════════════════════════════════════════════════════════════════
// INSTRUMENTS
// ════════════════════════════════════════════════════════════════
function renderInstruments(){
  const filtered=instruments.filter(i=>activeProfile==='shared'||i.owner===activeProfile||i.owner==='shared');
  const totalDebt=instruments.filter(i=>i.type==='loan').reduce((s,i)=>s+(i.capital||0),0);
  const totalInv=instruments.filter(i=>['saving','fd','investment','stock'].includes(i.type)).reduce((s,i)=>s+(i.units&&i.price?i.units*i.price:i.capital||0),0);
  const im=document.getElementById('instr-metrics');
  if(im)im.innerHTML=`
    <div class="metric-card"><div class="metric-label">Instruments</div><div class="metric-val">${instruments.length}</div></div>
    <div class="metric-card"><div class="metric-label">Total debt</div><div class="metric-val ${totalDebt?'red':''}">${fmtC(totalDebt)}</div></div>
    <div class="metric-card"><div class="metric-label">Invested</div><div class="metric-val green">${fmtC(totalInv)}</div></div>`;
  const grid=document.getElementById('instruments-grid');
  const empty=document.getElementById('instruments-empty');
  if(!filtered.length){if(grid)grid.style.display='none';if(empty)empty.style.display='block';return;}

function buildInstrStats(i){
  const pairs=[];
  if(i.capital)pairs.push(['Capital',fmtC(i.capital)]);
  if(i.rate)pairs.push([i.type==='loan'?'APR':'Rate',i.rate+'%']);
  if(i.period)pairs.push(['Period',i.period+' mo']);
  if(i.monthly)pairs.push([i.type==='loan'?'Monthly pay':'Monthly',fmtC(i.monthly)]);
  if(i.type==='stock'&&i.units)pairs.push(['Units',i.units]);
  if(i.type==='stock'&&i.price)pairs.push(['Price',fmtC(i.price)]);
  if(i.type==='stock'&&i.units&&i.price)pairs.push(['Value',fmtC(Math.round(i.units*i.price))]);
  return pairs.map(([l,v])=>`<div class="instr-stat"><div class="instr-stat-label">${l}</div><div class="instr-stat-val">${v}</div></div>`).join('');
}
function buildSchedule(i){
  if(!i.capital||!i.period||!i.start)return[];
  const rows=[];const start=new Date(i.start+'-01');let bal=i.capital;
  const rm=(i.rate||0)/100/12;
  for(let m=0;m<Math.min(i.period,120);m++){
    const d=new Date(start);d.setMonth(d.getMonth()+m);
    const label=MS[d.getMonth()]+'\''+String(d.getFullYear()).slice(2);
    if(i.type==='loan'){const interest=bal*rm;bal=Math.max(0,bal-Math.max(0,(i.monthly||0)-interest));}
    else bal+=bal*rm+(i.monthly||0);
    rows.push({label,balance:Math.round(bal)});
  }
  return rows;
}
function buildInstrProgress(i,schedule){
  if(!schedule.length||!i.start)return '';
  const now=new Date();const start=new Date(i.start+'-01');
  const passed=Math.max(0,(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth()));
  const pct=Math.min(100,(passed/i.period)*100);
  const cur=schedule[Math.min(passed,schedule.length-1)]?.balance||0;
  return `<div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:3px;">
    <span>${pct.toFixed(0)}% through</span><span>${i.type==='loan'?'Remaining':'~Value'}: ${fmtC(cur)}</span></div>
    <div class="instr-prog-bar"><div class="instr-prog-fill" style="width:${pct}%;background:${i.type==='loan'?'var(--danger)':'var(--accent)'};"></div></div>
  </div>`;
}

function renderNetWorth(){
  const tSav=savingsStreams.filter(s=>s.owner==='trevin'||s.owner==='shared').reduce((x,s)=>x+s.balance,0);
  const dSav=savingsStreams.filter(s=>s.owner==='dulini'||s.owner==='shared').reduce((x,s)=>x+s.balance,0);
  const tInv=instruments.filter(i=>['saving','fd','investment','stock'].includes(i.type)&&(i.owner==='trevin'||i.owner==='shared')).reduce((x,i)=>x+(i.units&&i.price?i.units*i.price:i.capital||0),0);
  const dInv=instruments.filter(i=>['saving','fd','investment','stock'].includes(i.type)&&(i.owner==='dulini'||i.owner==='shared')).reduce((x,i)=>x+(i.units&&i.price?i.units*i.price:i.capital||0),0);
  const tDebt=instruments.filter(i=>i.type==='loan'&&(i.owner==='trevin'||i.owner==='shared')).reduce((x,i)=>x+(i.capital||0),0);
  const dDebt=instruments.filter(i=>i.type==='loan'&&(i.owner==='dulini'||i.owner==='shared')).reduce((x,i)=>x+(i.capital||0),0);
  const tNW=tSav+tInv-tDebt,dNW=dSav+dInv-dDebt;
  const tot=tNW+dNW;
  const nt=document.getElementById('nw-total');if(nt)nt.textContent=fmtC(tot);
  const nt2=document.getElementById('nw-t');if(nt2)nt2.textContent=fmtC(tNW);
  const nd=document.getElementById('nw-d');if(nd)nd.textContent=fmtC(dNW);
  const ns=document.getElementById('nw-s');if(ns)ns.textContent=fmtC(tot);
}

}
function renderSuggestions(){
  const months=getIncludedHistoryMonths();
  const el=document.getElementById('suggestions-list');if(!el)return;
  if(!months.length){
    el.innerHTML='<div class="empty-state" style="text-align:left;padding:12px 0;"><div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px;">Import monthly history to unlock insights.</div><div style="font-size:11px;color:var(--text3);">Go to Insights → Import history. Once you have 2+ months, patterns and suggestions appear here.</div></div>';
    return;
  }
  const inc=totalIncome('shared'),exp=totalExpenses('shared'),bal=inc-exp;
  const savRate=inc>0?(totalSavingsTagged()/inc)*100:0;
  const suggestions=[];
  if(savRate<10)suggestions.push({icon:'💡',bg:'var(--warning-light)',text:`Savings rate is ${savRate.toFixed(1)}%. Sri Lanka average household saves ~12% of income.`,sub:`You need ${fmtC(Math.round(inc*0.12-totalSavingsTagged()))} /mo more tagged as savings to reach 12%.`});
  if(bal>0)suggestions.push({icon:'🎯',bg:'var(--accent-light)',text:`${fmtC(bal)} monthly balance is unallocated.`,sub:'Route this to a savings stream or instrument via the Tracker.'});
  const varItems=items.filter(i=>i.type==='expense'&&i.on&&i.tag==='discretionary').sort((a,b)=>toMonthly(b.val,b.freq)-toMonthly(a.val,a.freq));
  if(varItems.length)suggestions.push({icon:'✂️',bg:'var(--purple-light)',text:`Top discretionary spend: ${varItems[0].name} at ${fmtC(Math.round(toMonthly(varItems[0].val,varItems[0].freq)))}/mo.`,sub:'Discretionary items are the easiest to reduce when targeting savings goals.'});
  const loanInstr=instruments.find(i=>i.type==='loan');
  if(loanInstr&&loanInstr.period&&loanInstr.start){
    const start=new Date(loanInstr.start+'-01');const now=new Date();
    const passed=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
    const remaining=loanInstr.period-passed;
    if(remaining>0)suggestions.push({icon:'🔴',bg:'var(--danger-light)',text:`${loanInstr.name} clears in ~${remaining} months.`,sub:`At ${fmtC(loanInstr.monthly)}/mo — redirecting after payoff adds ${fmtC(loanInstr.monthly*12)}/year to savings.`});
  }
  const carried=txEvents.filter(e=>e.status==='carried').length;
  if(carried>0)suggestions.push({icon:'⏳',bg:'var(--info-light)',text:`${carried} surplus event${carried>1?'s are':' is'} carried forward without a tag.`,sub:'Go to Events tab to route them.'});
  // month-on-month drift
  if(months.length>=2){
    const last=monthHistory[months[months.length-1]];const prev=monthHistory[months[months.length-2]];
    if(last&&prev){
      const expDrift=(last.totalExpenses||0)-(prev.totalExpenses||0);
      if(expDrift>5000)suggestions.push({icon:'📈',bg:'var(--danger-light)',text:`Expenses up ${fmtC(expDrift)} vs last month.`,sub:'Check the Tracker for which categories drifted.'});
      const savDrift=(last.totalSaved||0)-(prev.totalSaved||0);
      if(savDrift>0)suggestions.push({icon:'🌱',bg:'var(--accent-light)',text:`Savings up ${fmtC(savDrift)} vs last month.`,sub:'Good trajectory — keep it going.'});
    }
  }
  el.innerHTML=suggestions.length===0?'<div class="empty-state">Looking good — no issues to flag.</div>':
    suggestions.map(s=>`<div class="suggestion-card"><div class="suggestion-icon" style="background:${s.bg};">${s.icon}</div><div><div class="suggestion-text">${s.text}</div><div class="suggestion-sub">${s.sub}</div></div></div>`).join('');
}
function renderSavingsVelocity(){

// TAX ESTIMATOR
function calcTax(){
  const grossEl=document.getElementById('tax-income');if(!grossEl)return;
  const gross=+grossEl.value||0;
  if(!gross){document.getElementById('tax-result').innerHTML='';return;}
  // Sri Lanka APIT bands (2023/2024 resident individual)
  const bands=[
    {limit:3000000,rate:0.06},{limit:3000000,rate:0.12},{limit:3000000,rate:0.18},
    {limit:3000000,rate:0.24},{limit:3000000,rate:0.30},{limit:Infinity,rate:0.36}
  ];
  let taxable=Math.max(0,gross-1200000); // relief 1.2M
  let tax=0,remaining=taxable;
  const breakdown=[];
  for(const band of bands){
    if(remaining<=0)break;
    const slice=Math.min(remaining,band.limit);
    const bandTax=slice*band.rate;
    if(slice>0)breakdown.push({rate:(band.rate*100)+'%',income:slice,tax:bandTax});
    tax+=bandTax;remaining-=slice;
  }
  const effective=gross>0?(tax/gross)*100:0;
  const takeHome=gross-tax;
  const el=document.getElementById('tax-result');if(!el)return;
  el.innerHTML=`<div class="tax-result">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;"><div style="font-size:10px;color:var(--text3);margin-bottom:2px;">ANNUAL TAX</div><div style="font-size:16px;font-weight:700;color:var(--danger);">${fmtC(Math.round(tax))}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;color:var(--text3);margin-bottom:2px;">TAKE HOME</div><div style="font-size:16px;font-weight:700;color:var(--accent);">${fmtC(Math.round(takeHome))}</div></div>
      <div style="text-align:center;"><div style="font-size:10px;color:var(--text3);margin-bottom:2px;">EFFECTIVE RATE</div><div style="font-size:16px;font-weight:700;">${effective.toFixed(1)}%</div></div>
    </div>
    <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;">Band breakdown</div>
    ${breakdown.map(b=>`<div class="tax-band-row"><span>${b.rate} band</span><span>${fmtC(Math.round(b.income))}</span><span style="color:var(--danger);">${fmtC(Math.round(b.tax))}</span></div>`).join('')}
    <div style="font-size:10px;color:var(--text3);margin-top:8px;">Based on Sri Lanka APIT bands with LKR 1.2M personal relief. Monthly take-home: ${fmtC(Math.round(takeHome/12))}.</div>
  </div>`;
}

function handleImportFiles(files){
  if(!files||!files.length)return;
  importQueue=[];
  const fileArr=Array.from(files);
  let processed=0;
  const preview=document.getElementById('import-local-preview');
  if(preview)preview.innerHTML=`<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Processing ${fileArr.length} file${fileArr.length>1?'s':''}...</div>`;
  fileArr.forEach((file,fi)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        let rows=[];
        if(file.name.toLowerCase().endsWith('.csv')){
          rows=parseCSVtoRows(ev.target.result);
        } else if(typeof XLSX!=='undefined'){
          const wb=XLSX.read(ev.target.result,{type:'binary'});
          // Find Tracker sheet first, otherwise use first sheet
          const sheetName=wb.SheetNames.find(n=>/tracker/i.test(n))||wb.SheetNames[0];
          const ws=wb.Sheets[sheetName];
          // Find the actual header row (skip merged/title rows)
          const csv=XLSX.utils.sheet_to_csv(ws,{blankrows:false});
          rows=parseCSVtoRows(csv,true);
        }
        const monthKey=detectMonthFromFilename(file.name);
        importQueue.push({filename:file.name,monthKey,rows,source:'local'});
      } catch(err){
        importQueue.push({filename:file.name,monthKey:null,rows:[],source:'local',error:err.message});
      }
      processed++;
      if(processed===fileArr.length)renderImportPreview();
    };
    if(file.name.toLowerCase().endsWith('.csv'))reader.readAsText(file);
    else reader.readAsBinaryString(file);
  });
}
function detectMonthFromFilename(name){
  for(let mi=0;mi<12;mi++){
    const short=MS[mi],long=MONTHS[mi];
    const re=new RegExp('(?:'+short+'|'+long+')[^0-9]*([0-9]{4})','i');
    const m=name.match(re);if(m)return getTkey(mi,+m[1]);
    const re2=new RegExp('([0-9]{4})[^0-9]*(?:0?'+(mi+1)+'(?![0-9])|'+short+'|'+long+')','i');
    const m2=name.match(re2);if(m2)return getTkey(mi,+m2[1]);
  }
  return null;
}
function parseCSVtoRows(csv,skipTitleRows){
  const lines=csv.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<2)return[];
  // Find the real header row — look for "item" or "name" or "budget" in a row
  let headerIdx=0;
  if(skipTitleRows){
    for(let i=0;i<Math.min(5,lines.length);i++){
      const low=lines[i].toLowerCase();
      if(low.includes('item')||low.includes('name')||low.includes('budget')||low.includes('actual')){headerIdx=i;break;}
    }
  }
  const headers=splitCSVLine(lines[headerIdx]).map(h=>h.trim().toLowerCase().replace(/[^a-z0-9\s]/g,'').trim());
  return lines.slice(headerIdx+1).map(line=>{
    const vals=splitCSVLine(line);
    const row={};
    headers.forEach((h,i)=>row[h]=(vals[i]||'').trim().replace(/^"|"$/g,''));
    return row;
  }).filter(r=>Object.values(r).some(v=>v));
}
function splitCSVLine(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')inQ=!inQ;
    else if(line[i]===','&&!inQ){result.push(cur);cur='';}
    else cur+=line[i];
  }
  result.push(cur);return result;
}
function generateMonthOptions(){
  const now=new Date();let opts='';
  for(let y=now.getFullYear();y>=now.getFullYear()-3;y--)
    for(let m=11;m>=0;m--)
      opts+=`<option value="${getTkey(m,y)}">${MS[m]} ${y}</option>`;
  return opts;
}
function renderImportPreview(){

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">

        <span style="font-size:10px;color:${sc};">${st}</span>
      </div>

        <select class="form-select" style="width:auto;font-size:11px;" onchange="importQueue[${fi}].monthKey=this.value"><option value="">— select —</option>${generateMonthOptions()}</select></div>`:''}
      ${f.rows&&f.rows.length?`<div style="font-size:10px;color:var(--text3);margin-top:4px;">${f.rows.length} data rows found</div>`:''}
    </div>`;

  el.innerHTML=html;

async function loadDriveFiles(){
  if(!accessToken){
    const dfl=document.getElementById('drive-files-list');
    if(dfl)dfl.innerHTML='<div class="empty-state"><i class="ti ti-plug" style="font-size:22px;display:block;margin-bottom:8px;"></i>Not connected.</div>';
    return;
  }
  const dfl=document.getElementById('drive-files-list');
  if(dfl)dfl.innerHTML='<div class="empty-state"><i class="ti ti-loader" style="font-size:22px;display:block;margin-bottom:8px;animation:spin 1s linear infinite;"></i>Loading...</div>';
  try{
    const res=await apiCall('GET',`https://www.googleapis.com/drive/v3/files?q='${DRIVE_FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,size,modifiedTime)&orderBy=name+desc&pageSize=100`);
    driveFilesList=res.files||[];
    renderDriveFilesList();
  } catch(e){if(dfl)dfl.innerHTML=`<div class="empty-state" style="color:var(--danger);">Failed: ${e.message.slice(0,80)}</div>`;}
}
function renderDriveFilesList(){
  const el=document.getElementById('drive-files-list');if(!el)return;
  const files=driveFilesList.filter(f=>f.name.endsWith('.xlsx')||f.name.endsWith('.xls')||f.name.endsWith('.csv'));
  if(!files.length){el.innerHTML='<div class="empty-state">No archive files found. Save a month first.</div>';return;}
  el.innerHTML=`<div style="background:var(--surface2);padding:7px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);">
    <input type="checkbox" id="drive-select-all" style="accent-color:var(--accent);" onchange="driveSelectAll(this.checked)">
    <label for="drive-select-all" style="cursor:pointer;">${files.length} files — select all</label>
  </div>
  ${files.map(f=>{
    const mk=detectMonthFromFilename(f.name);
    const sz=f.size?Math.round(f.size/1024)+'kb':'';
    const mod=f.modifiedTime?new Date(f.modifiedTime).toLocaleDateString('en-LK'):'';

async function downloadDriveFile(fileId,fileName){

async function deleteDriveFile(fileId,fileName){

async function confirmImport(){
  let imported=0,skipped=0;
  for(const f of importQueue){
    if(!f.monthKey||f.error){skipped++;continue;}
    processImportRows(f.rows,f.monthKey);imported++;
  }
  if(activeImportTab==='drive'&&driveSelectedIds.size>0){
    const selectedFiles=driveFilesList.filter(f=>driveSelectedIds.has(f.id));
    for(const f of selectedFiles){
      const monthKey=detectMonthFromFilename(f.name);
      if(!monthKey){skipped++;continue;}
      try{
        const res=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{'Authorization':'Bearer '+accessToken}});
        const buf=await res.arrayBuffer();
        let rows=[];
        if(typeof XLSX!=='undefined'){
          const wb=XLSX.read(buf,{type:'array'});
          const sheetName=wb.SheetNames.find(n=>/tracker/i.test(n))||wb.SheetNames[0];
          rows=parseCSVtoRows(XLSX.utils.sheet_to_csv(wb.Sheets[sheetName]),true);
        }
        processImportRows(rows,monthKey);imported++;
      } catch(e){skipped++;}
    }
  }
  closeImportModal();
  if(imported>0){renderInsights();if(document.getElementById('tab-tracker')?.classList.contains('active'))renderTracker();}
  addNotification('success',`Imported ${imported} month${imported>1?'s':''}.${skipped?` ${skipped} skipped.`:''}`,null);
  alert(`Import complete.\n✅ ${imported} month${imported>1?'s':''} imported.${skipped?`\n⚠️ ${skipped} skipped.`:''}`);
}
function processImportRows(rows,monthKey){
  const headers=rows.length>0?Object.keys(rows[0]).map(h=>h.toLowerCase()):[];
  const isBudgetExport=headers.some(h=>h.includes('budget')||h.includes('actual'));
  if(isBudgetExport)importBudgetExport(rows,monthKey);
  else importBankStatement(rows,monthKey);
  const[y,m]=monthKey.split('-');
  if(!monthHistory[monthKey]){
    monthHistory[monthKey]={
      totalIncome:totalIncome('shared'),totalExpenses:totalExpenses('shared'),
      balance:totalIncome('shared')-totalExpenses('shared'),totalSaved:totalSavingsTagged(),
      perPerson:{trevin:{expenses:totalExpenses('trevin'),income:totalIncome('trevin')},
        dulini:{expenses:totalExpenses('dulini'),income:totalIncome('dulini')}},
      imported:true,included:true
    };
  }
  markDirty();
}
function importBudgetExport(rows,monthKey){
  if(!trackerData[monthKey])trackerData[monthKey]={};
  const td=trackerData[monthKey];
  rows.forEach(row=>{
    // Try multiple possible column names
    const name=(row['item']||row['name']||row['']).trim().toLowerCase();
    const actualRaw=row['actual']||row['actual lkr']||row['actual (lkr)']||'';
    const actual=parseFloat(String(actualRaw).replace(/,/g,''))||0;
    if(!name||!actual)return;
    const matchedItem=items.find(i=>i.name.toLowerCase()===name||i.name.toLowerCase().includes(name.split(' ')[0]));
    if(matchedItem&&actual>0){
      const prefix=matchedItem.type==='income'?'inc_':'exp_';
      td[prefix+matchedItem.id]=actual;
    }
  });
}
function importBankStatement(rows,monthKey){
  if(!trackerData[monthKey])trackerData[monthKey]={};
  const td=trackerData[monthKey];
  rows.forEach(row=>{
    const name=(row['name']||row['description']||row['narration']||row['particular']||'').trim().toLowerCase();
    const amtRaw=row['amount']||row['debit']||row['credit']||row['value']||'';
    const amount=parseFloat(String(amtRaw).replace(/,/g,''))||0;
    if(!name||!amount)return;
    const matchedItem=items.find(i=>i.name.toLowerCase().includes(name.split(' ')[0])||name.includes(i.name.toLowerCase().split(' ')[0]));
    if(matchedItem&&amount>0){td[(matchedItem.type==='income'?'inc_':'exp_')+matchedItem.id]=amount;}
  });
}

async function saveMonthToAll(month,year,overwrite){
  const tkey=getTkey(month,year);
  const td=trackerData[tkey]||{};
  const tabName=MS[month]+' '+year;
  const incItems=items.filter(i=>i.type==='income');
  const expItems=items.filter(i=>i.type==='expense');
  let tBI=0,tAI=0,tBE=0,tAE=0;
  const rows=[
    [`Budget — ${MONTHS[month]} ${year}`,'Budget (LKR)','Actual (LKR)','Variance','Owner','Purpose'],
    ['INCOME'],
    ...incItems.map(item=>{
      const b=item.on?Math.round(toMonthly(item.val,item.freq)):0;
      const a=td['inc_'+item.id]!==undefined?td['inc_'+item.id]:'';
      const v=a!==''?+a-b:'';tBI+=b;if(a!=='')tAI+=+a;
      return[item.name,b,a,v,item.owner,item.purpose||''];
    }),
    [''],['EXPENSES'],
    ...expItems.map(item=>{
      const b=item.on?Math.round(toMonthly(item.val,item.freq)):0;
      const a=td['exp_'+item.id]!==undefined?td['exp_'+item.id]:'';
      const v=a!==''?b-+a:'';tBE+=b;if(a!=='')tAE+=+a;
      return[item.name,b,a,v,item.owner,item.purpose||''];
    }),
    [''],['Net balance',tBI-tBE,tAI&&tAE?tAI-tAE:'','','','']
  ];
  // Save to history
  monthHistory[tkey]={
    totalIncome:tBI,totalExpenses:tBE,balance:tBI-tBE,totalSaved:totalSavingsTagged(),
    items:[...items],tracker:td,notes:monthNotes[tkey]||'',included:true,
    perPerson:{
      trevin:{expenses:totalExpenses('trevin'),income:totalIncome('trevin')},
      dulini:{expenses:totalExpenses('dulini'),income:totalIncome('dulini')}
    }
  };
  try{localStorage.setItem('bp_last_saved_month',tkey);}catch(e){}
  markDirty();
  if(accessToken){
    try{
      setSyncStatus('syncing','Saving month...');
      await saveMonthTabToSheet(month,year,activeConn.sheetId,rows,overwrite);
      await saveMonthToDrive(month,year,rows,tabName);
      setSyncStatus('connected','Saved '+tabName);
      setLastSync();
    } catch(e){setSyncStatus('error','Save failed: '+e.message.slice(0,40));console.error(e);}
  }
}
async function saveMonthTabToSheet(month,year,sheetId,rows,overwrite){
  if(!accessToken)return;
  const tabName=MS[month]+' '+year;
  const meta=await apiCall('GET',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties`);
  const existing=meta.sheets?.find(s=>s.properties.title===tabName);
  if(existing&&overwrite){
    await apiCall('POST',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent("'"+tabName+"'!A1:Z200")}:clear`,{});
  } else if(!existing){
    await apiCall('POST',`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}:batchUpdate`,{requests:[{addSheet:{properties:{title:tabName}}}]});
  }
  await apiCall('PUT',sheetUrl(sheetId,tabName,'A1')+'?valueInputOption=USER_ENTERED',{values:rows});
}
async function saveMonthToDrive(month,year,rows,tabName){
  if(!accessToken||typeof XLSX==='undefined')return;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Dynamic Budget Planner — '+tabName],[''],['Income','Amount'],...items.filter(i=>i.type==='income'&&i.on).map(i=>[i.name,Math.round(toMonthly(i.val,i.freq))]),[''],[''],[''],[' Total',Math.round(totalIncome('shared'))],[''],['Expenses','Amount','Category','Purpose'],...items.filter(i=>i.type==='expense'&&i.on).map(i=>[i.name,Math.round(toMonthly(i.val,i.freq)),i.cat,i.purpose||'']),[''],['Total Expenses',Math.round(totalExpenses('shared'))],[''],['Balance',Math.round(totalIncome('shared')-totalExpenses('shared'))]]),'Dashboard');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Tracker');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Stream','Balance','Goal','Progress %','Owner'],...savingsStreams.map(s=>[s.name,s.balance,s.goal||'',s.goal?((s.balance/s.goal)*100).toFixed(1)+'%':'—',s.owner])]),'Savings');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Name','Type','Capital','Rate%','Period','Monthly','Owner','Start'],...instruments.map(i=>[i.name,i.type,i.capital,i.rate,i.period,i.monthly,i.owner,i.start])]),'Instruments');
  const wbout=XLSX.write(wb,{type:'binary',bookType:'xlsx'});
  const buf=new ArrayBuffer(wbout.length);const view=new Uint8Array(buf);
  for(let i=0;i<wbout.length;++i)view[i]=wbout.charCodeAt(i)&0xFF;
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fileName=tabName+' — Budget Tracker.xlsx';
  const searchRes=await apiCall('GET',`https://www.googleapis.com/drive/v3/files?q=name='${encodeURIComponent(fileName)}'+and+'${DRIVE_FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id)`);
  const existingFile=searchRes.files?.[0];
  if(existingFile){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:blob});
  } else {
    const meta={name:fileName,parents:[DRIVE_FOLDER_ID]};
    const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob,fileName);
    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+accessToken},body:form});
  }
}

function setSyncStatus(state,label){
  const dot=document.getElementById('sync-dot');if(dot)dot.className='sync-dot '+state;
  const lbl=document.getElementById('sync-label');if(lbl)lbl.textContent=label;
}
function setLastSync(){const el=document.getElementById('sync-last');if(el)el.textContent='Synced '+new Date().toLocaleTimeString();}
async function apiCall(method,url,body){
  if(!accessToken)throw new Error('Not authenticated');
  const opts={method,headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}};
  if(body!==undefined)opts.body=JSON.stringify(body);
  const res=await fetch(url,opts);
  if(res.status===401){accessToken=null;setSyncStatus('error','Session expired — reconnect');throw new Error('Token expired');}
  if(!res.ok){const t=await res.text();throw new Error(t.slice(0,200));}
  return res.json();
}
function sheetUrl(sheetId,tab,range){
  return `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent("'"+tab+"'!"+range)}`;
}
async function sheetsPull(){
  if(!accessToken)return;
  setSyncStatus('syncing','Pulling...');
  try{
    const data=await apiCall('GET',sheetUrl(activeConn.sheetId,activeConn.sheetName,'B1:C35'));
    const rows=data.values||[];
    let section='';
    rows.forEach(row=>{
      const b=(row[0]||'').toString().trim();
      const c=(row[1]||'').toString().replace(/,/g,'').trim();
      const val=parseFloat(c)||0;
      if(b.includes('INCOME')){section='income';return;}
      if(b.includes('EXPENSE')){section='expense';return;}
      if(!b||b.includes('BALANCE')||b.includes('ANALYSIS')||b.includes('Planner')||b.includes('Dynamic'))return;
      if(!section)return;
      const cleanB=b.replace(/\s*\(LKR\)\s*/i,'').trim().toLowerCase();
      const existing=items.find(i=>i.name.toLowerCase()===cleanB||i.name.toLowerCase()===b.toLowerCase());
      if(existing)existing.val=val;
      else if(val>0&&b)items.push({id:uid(),type:section==='income'?'income':'expense',name:b.replace(/\s*\(LKR\)\s*/i,'').trim(),val,freq:'monthly',cat:section==='income'?'':'other',tag:'variable',purpose:'',owner:'shared',on:true,dueDay:0,bufferDays:0,splitRatio:{trevin:50,dulini:50},calEventId:null,history:[]});
    });
    recalc();setSyncStatus('connected','Pulled');setLastSync();
  } catch(e){setSyncStatus('error','Pull failed');console.error('Pull:',e);}
}
async function sheetsPush(){
  if(!accessToken)return;
  setSyncStatus('syncing','Pushing...');
  try{
    const inc=items.filter(i=>i.type==='income');const exp=items.filter(i=>i.type==='expense');
    const tI=totalIncome('shared'),tE=totalExpenses('shared'),bal=tI-tE;
    const values=[
      ['','⚡ Dynamic Budget Planner — Impact Dashboard','',''],
      ['','','',''],
      ['','💵 INCOME STREAMS','','TOTAL COMBINED INCOME'],
      ...inc.map(i=>['',i.name+(i.type==='income'?' (LKR)':''),i.on?i.val:0,'']),
      ['','','',Math.round(tI)],
      ['','','',''],
      ['','💸 ITEMIZED EXPENSES','','TOTAL MONTHLY EXPENSES'],
      ...exp.map(i=>['',i.name,i.on?i.val:0,'']),
      ['','','',Math.round(tE)],
      ['','','',''],
      ['','MONTHLY BALANCE','',Math.round(bal)],
      ['','','',''],
      ['','🤖 FINANCIAL IMPACT ANALYSIS','',bal>=0?`✅ SURPLUS ACHIEVED: Budget balanced with surplus of ${fmtC(bal)}.`:`⚠️ DEFICIT: Over budget by ${fmtC(Math.abs(bal))}.`],
    ];
    await apiCall('PUT',sheetUrl(activeConn.sheetId,activeConn.sheetName,'A1')+'?valueInputOption=USER_ENTERED',{values,majorDimension:'ROWS'});
    setSyncStatus('connected','Pushed');setLastSync();
  } catch(e){setSyncStatus('error','Push failed');console.error('Push:',e);}
}
function debouncePush(){if(pushDebounce)clearTimeout(pushDebounce);pushDebounce=setTimeout(()=>{if(accessToken)sheetsPush();},2000);}
function startPolling(){
  if(pollInterval)clearInterval(pollInterval);
  pollInterval=setInterval(async()=>{
    if(!accessToken)return;
    try{
      const data=await apiCall('GET',sheetUrl(activeConn.sheetId,activeConn.sheetName,'B1:C3'));
      const hash=JSON.stringify(data.values||[]);
      if(hash!==window._lastSheetHash){window._lastSheetHash=hash;await sheetsPull();}
    } catch(e){}
  },15000);
}
